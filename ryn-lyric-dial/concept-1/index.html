<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>Ryn · 唱片沟槽 Vinyl Groove</title>
<link rel="stylesheet" href="../assets/common.css"></head><body>
<div id="stage">
  <div class="hud" style="left:auto;right:40px;text-align:right"><b>RYN</b> &nbsp;·&nbsp; Lyrics · Vinyl Groove</div>
  <div class="track" style="right:40px;bottom:64px;text-align:right">
    <div class="t">夜明けの航路 <span style="color:#6b7385;font-weight:400">(demo)</span></div>
    <div class="a">soleil de minuit · Placeholder lyrics</div>
    <div class="m" id="time"></div>
  </div>
  <div class="foot" style="left:auto;right:40px">33⅓ RPM · <span>Side A</span></div>
</div>
<script src="../assets/common.js"></script>
<script>
const CX = 230, CY = 650, R = 640, LABEL = 128;
const PIV = {x: 64, y: 40}, ARM = 470;             // tonearm pivot + length (fixed)
const R_OUT = 610, R_IN = 178, RETURN = 1.0;       // lead-in groove → run-out groove near the label
const rAt = tt => lerp(R_OUT, R_IN, clamp(tt / SONG_DUR));          // needle radius at song time tt
const grooveR = i => rAt((i + .5) * LINE_DUR);                       // line i's groove = needle radius mid-line
const easeInOutSine = x => -(Math.cos(Math.PI * x) - 1) / 2;
function tipAt(r) {   // where the arm's arc (around PIV, radius ARM) crosses groove radius r (right-hand solution)
  const dx = CX - PIV.x, dy = CY - PIV.y, d = Math.hypot(dx, dy), a = (ARM * ARM - r * r + d * d) / (2 * d), h = Math.sqrt(Math.max(0, ARM * ARM - a * a));
  return {x: PIV.x + a * dx / d + h * dy / d, y: PIV.y + a * dy / d - h * dx / d};
}
boot(({ctx, cover}, t, s) => {
  bgFill(ctx, 900, 300, 1100);
  const rot = t * 0.35;               // slow visual spin

  // record body
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 60;
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2);
  const g = ctx.createRadialGradient(CX, CY, LABEL, CX, CY, R);
  g.addColorStop(0, '#0b0f18'); g.addColorStop(.97, '#0e131e'); g.addColorStop(1, '#161d2b');
  ctx.fillStyle = g; ctx.fill(); ctx.restore();
  // fine grooves
  ctx.lineWidth = 1;
  for (let r = LABEL + 18; r < R - 6; r += 3.2) {
    ctx.strokeStyle = `rgba(255,255,255,${0.018 + 0.012 * Math.sin(r * .37)})`;
    ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.stroke();
  }
  // rotating sheen (two opposite soft wedges)
  for (const off of [0, Math.PI]) {
    ctx.save(); ctx.beginPath(); ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R - 4, rot + off - .22, rot + off + .22); ctx.closePath(); ctx.clip();
    const sg = ctx.createRadialGradient(CX, CY, LABEL, CX, CY, R);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.6, 'rgba(200,210,235,.045)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg; ctx.fillRect(CX - R, CY - R, R * 2, R * 2); ctx.restore();
  }
  // rim
  ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(CX, CY, R - 1, 0, Math.PI * 2); ctx.stroke();

  // label = cover
  drawCover(ctx, cover, CX, CY, LABEL, rot);
  ctx.strokeStyle = 'rgba(184,149,90,.55)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(CX, CY, LABEL + 6, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = C.bg; ctx.beginPath(); ctx.arc(CX, CY, 7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.stroke();

  // ── needle tracks the song: outer groove at 0:00 → inner groove near the label at the end (continuous)
  const sT = s.song;
  let rN = rAt(sT);
  if (sT < RETURN) rN = lerp(R_IN, rAt(sT), easeInOutSine(sT / RETURN));   // arm glides back out when the song loops
  const tip = tipAt(rN);
  // continuous line position (no wrap inside the song): p ∈ [-1, N-1]
  const pLin = (s.idx === 0 && s.p > N - 1.5) ? s.p - N : s.p;

  // lyric lines: line i lives on groove r_i = needle radius at the middle of its time slot
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  for (let i = 0; i < N; i++) {
    const d = i - pLin; if (d < -2.7 || d > 2.7) continue;
    const f = focus(d), e = f * f * (3 - 2 * f);
    const ri = grooveR(i);
    // the groove itself (true radius), short arc running on from the arm
    const ga = Math.atan2(tipAt(ri).y - CY, tipAt(ri).x - CX);
    ctx.lineWidth = 1; ctx.strokeStyle = f > 0.01 ? `rgba(184,149,90,${0.4 * f})` : `rgba(255,255,255,${0.05 * clamp(1 - (Math.abs(d) - 1.5) / 1.5)})`;
    ctx.beginPath(); ctx.arc(CX, CY, ri, ga - .02, ga + .55); ctx.stroke();
    // text sits on the arm's sweep at its groove; neighbours ease apart a little to give the current line air
    const push = d > 0 ? -50 * clamp(d) : 26 * clamp(-d);
    const P = tipAt(ri + push);
    const size = lerp(16, 27, e);
    const fade = clamp(1 - (Math.abs(d) - 1.4) / 1.2);
    ctx.font = `${f > .5 ? 500 : 400} ${size}px ${FONT_JA}`; ctx.letterSpacing = `${(e * 1.2).toFixed(2)}px`;
    const base = d > 0 ? C.sec : C.muted;
    ctx.fillStyle = f > 0.01 ? mixColor(base, C.goldHi, f) : base;
    ctx.globalAlpha = clamp(fade * (d < 0 ? .5 : .75) + f * .5);
    const tx = P.x + 18, ty = P.y + size * .36;
    ctx.fillText(LYRICS[i].ja, tx, ty);
    if (f > 0.02) { ctx.globalAlpha = f * f; ctx.letterSpacing = '1px'; ctx.font = `400 14px ${FONT_ZH}`; ctx.fillStyle = C.sec; ctx.fillText(LYRICS[i].zh, tx + 2, ty + 24); }
    ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
  }

  // tonearm: fixed pivot, fixed length; its angle follows the needle radius
  const wob = Math.sin(t * 2.1) * 0.0025;
  const ang = Math.atan2(tip.y - PIV.y, tip.x - PIV.x) + wob, len = ARM;
  ctx.save(); ctx.translate(PIV.x, PIV.y); ctx.rotate(ang);
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
  const ag = ctx.createLinearGradient(0, -3, 0, 3); ag.addColorStop(0, '#c9ced8'); ag.addColorStop(1, '#6b7385');
  ctx.fillStyle = ag; ctx.fillRect(0, -2.5, len - 34, 5);
  // headshell
  ctx.fillStyle = '#2a3242'; ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(len - 40, -9, 40, 18, 3); ctx.fill(); ctx.stroke();
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc(len - 2, 0, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // pivot
  ctx.fillStyle = '#1b2232'; ctx.strokeStyle = 'rgba(255,255,255,.18)';
  ctx.beginPath(); ctx.arc(PIV.x, PIV.y, 30, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#a3aab8'; ctx.beginPath(); ctx.arc(PIV.x, PIV.y, 9, 0, Math.PI * 2); ctx.fill();
  // needle glow on groove
  const gl = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, 26);
  gl.addColorStop(0, 'rgba(212,180,122,.35)'); gl.addColorStop(1, 'rgba(212,180,122,0)');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(tip.x, tip.y, 26, 0, Math.PI * 2); ctx.fill();

  // right column: line counter + next line
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.font = `600 10px ${FONT_UI}`; ctx.fillStyle = C.muted; ctx.fillText('L I N E', 1240, 292);
  ctx.font = `200 64px ${FONT_UI}`; ctx.fillStyle = C.sec; ctx.fillText(String(s.idx + 1).padStart(2, '0'), 1196, 356);
  ctx.font = `300 18px ${FONT_UI}`; ctx.fillStyle = C.muted; ctx.fillText('/' + N, 1240, 356);
  ctx.fillStyle = C.gold; ctx.fillRect(1212, 372, 28, 1.5);
  ctx.font = `600 10px ${FONT_UI}`; ctx.fillStyle = C.muted; ctx.fillText('N E X T', 1240, 404);
  ctx.font = `400 14px ${FONT_JA}`; ctx.fillStyle = C.sec; ctx.fillText(LYRICS[(s.idx + 1) % N].ja, 1240, 428);
  ctx.font = `400 12px ${FONT_ZH}`; ctx.fillStyle = C.muted; ctx.fillText(LYRICS[(s.idx + 1) % N].zh, 1240, 448);
  ctx.textAlign = 'left';
  // progress: thin arc along record rim
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(CX, CY, R + 14, -Math.PI / 2 - .05, .35); ctx.stroke();
  ctx.strokeStyle = C.gold;
  ctx.beginPath(); ctx.arc(CX, CY, R + 14, -Math.PI / 2 - .05, -Math.PI / 2 - .05 + (.4 + Math.PI / 2) * s.progress); ctx.stroke();
}, {trans: 1.1});
function mixColor(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = sh => Math.round(lerp(pa >> sh & 255, pb >> sh & 255, k));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
</script></body></html>
